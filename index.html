<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4D Games</title>
<link rel="stylesheet" href="./shared/style.css?v=17">
<style>
  /* The index is the one page here that scrolls and is not a game, so it opts
     out of the full-bleed canvas layout the shared sheet sets up. */
  html, body { overflow: auto; height: auto; }
  body { display: flex; justify-content: center; padding: 8vh 20px 60px; }
  main { width: 100%; max-width: 680px; }
  h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: .01em; }
  .lede { color: var(--dim); margin: 0 0 34px; font-size: 14.5px; max-width: 52ch; }

  .games { display: grid; gap: 12px; }
  a.game {
    display: block; text-decoration: none; color: inherit;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
    transition: border-color .14s, transform .14s;
  }
  a.game:hover { border-color: var(--accent); transform: translateY(-1px); }
  a.game h2 { margin: 0 0 3px; font-size: 16px; }
  a.game p { margin: 0; color: var(--dim); font-size: 13px; }
  .two { display: inline-block; font-size: 10px; letter-spacing: .08em;
         color: var(--dim); border: 1px solid var(--line); border-radius: 5px;
         padding: 1px 6px; margin-left: 8px; vertical-align: 2px;
         text-transform: uppercase; }
  .dim { display: inline-block; font-size: 10.5px; letter-spacing: .1em;
         color: var(--ax3); border: 1px solid var(--line); border-radius: 5px;
         padding: 1px 6px; margin-right: 8px; vertical-align: 2px; }

  .note { margin-top: 34px; color: var(--dim); font-size: 12.5px;
          border-top: 1px solid var(--line); padding-top: 18px; max-width: 56ch; }
  .note b { color: var(--ink); font-weight: 600; }
  kbd { vertical-align: 1px; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>
  <div class="games" id="games"></div>
  <div class="note" id="notes"></div>
</main>
<script type="module">
  import { INDEX } from './shared/index-copy.js';
  document.getElementById('title').textContent = INDEX.title;
  document.getElementById('lede').textContent = INDEX.lede;
  document.getElementById('games').innerHTML = INDEX.games.map((g) => `
    <a class="game" href="${g.href}">
      <h2><span class="dim">${g.dim}</span>${g.name}${
        g.tag ? `<span class="two">${g.tag}</span>` : ''}</h2>
      <p>${g.text}</p>
    </a>`).join('');
  document.getElementById('notes').innerHTML = INDEX.notes.map((n) =>
    `<p><b>${n.lead}</b> ${n.text}</p>`).join('');
</script>
</body>
</html>
