<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unknot</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161c26; --line: #2c3646;
    --ink: #e8eef7; --dim: #8fa0b8; --accent: #4cc9f0; --good: #6ee7a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--ink); }
  #view { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #view:active { cursor: grabbing; }
  .panel {
    position: fixed; background: color-mix(in srgb, var(--panel) 88%, transparent);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    backdrop-filter: blur(8px);
  }
  #hud { top: 14px; left: 14px; min-width: 232px; }
  #hud h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: .02em; }
  #blurb { margin: 0 0 10px; color: var(--dim); font-size: 12.5px; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
  .row + .row { margin-top: 3px; }
  .row span:first-child { color: var(--dim); }
  #status { margin-top: 8px; font-weight: 600; letter-spacing: .08em; font-size: 12px; }
  #status.solved { color: var(--good); }
  #det.ok { color: var(--good); }
  #det.stuck { color: #ff8fa3; }
  #help { bottom: 14px; left: 14px; max-width: 300px; color: var(--dim); font-size: 12.5px; }
  #help b { color: var(--ink); font-weight: 600; }
  #help .goal { color: var(--accent); margin-top: 8px; }
  #help .w-only { display: none; }
  body.four-d #help .w-only { display: block; }
  #help p { margin: 0 0 6px; }
  #help p:last-child { margin-bottom: 0; }
  .controls { margin-top: 10px; display: flex; gap: 8px; }
  select, button {
    font: inherit; font-size: 13px; color: var(--ink); background: #1e2634;
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; cursor: pointer;
  }
  select { flex: 1; }
  button:hover, select:hover { border-color: var(--accent); }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="panel" id="hud">
  <h1 id="level">—</h1>
  <p id="blurb"></p>
  <div class="row"><span>Length</span><span id="len">0</span></div>
  <div class="row"><span>Taut at</span><span id="target">0</span></div>
  <div class="row" id="detRow"><span>Knot determinant</span><span id="det">1</span></div>
  <div id="status"></div>
  <div class="controls">
    <select id="levels"></select>
    <button id="reset">Reset</button>
  </div>
</div>

<div class="panel" id="help">
  <p><b>Click a face</b> to push the rope that way.</p>
  <p><b>Drag a bend</b> to walk it along the rope.</p>
  <p><b>Right-click</b> the rope to pull slack in.</p>
  <p><b>Drag the background</b> to look around.</p>
  <p class="w-only"><b>Drag a cube up or down</b> to move it through the 4th dimension.</p>
  <p class="goal">Pull the rope taut.</p>
</div>

<script type="module" src="./src/app.js"></script>
</body>
</html>
