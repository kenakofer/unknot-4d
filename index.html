<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unknot</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161c26; --line: #2c3646;
    --ink: #e8eef7; --dim: #8fa0b8; --accent: #4cc9f0; --good: #6ee7a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--ink); }
  #view { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #view:active { cursor: grabbing; }
  .panel {
    position: fixed; background: color-mix(in srgb, var(--panel) 88%, transparent);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    backdrop-filter: blur(8px);
  }
  #hud { top: 14px; left: 14px; min-width: 232px; }
  #hud h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: .02em; }
  #blurb { margin: 0 0 10px; color: var(--dim); font-size: 12.5px; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
  .row + .row { margin-top: 3px; }
  .row span:first-child { color: var(--dim); }
  #status { margin-top: 8px; font-weight: 600; letter-spacing: .08em; font-size: 12px; }
  #status.solved { color: var(--good); }
  #det.ok { color: var(--good); }
  #det.stuck { color: #ff8fa3; }
  #help { bottom: 14px; left: 14px; max-width: 300px; color: var(--dim); font-size: 12.5px; }
  #help b { color: var(--ink); font-weight: 600; }
  #help .goal { color: var(--accent); margin-top: 8px; }
  #help .w-only { display: none; }
  body.four-d #help .w-only { display: block; }

  /* Direction pad */
  #padPanel { top: 14px; right: 14px; width: 218px; }
  .padhead { font-weight: 600; margin-bottom: 2px; }
  #selInfo { color: var(--dim); font-size: 12px; margin-bottom: 10px;
             font-variant-numeric: tabular-nums; }
  #pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .padbtn {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 7px 0 5px; border-radius: 7px; cursor: pointer;
    background: #1e2634; border: 1px solid var(--line); color: var(--ink);
    font: inherit; transition: border-color .12s, background .12s, opacity .12s;
  }
  .padbtn .glyph { font-size: 15px; line-height: 1; }
  .padbtn .nm { font-size: 9.5px; color: var(--dim); letter-spacing: .02em; }
  .padbtn:hover { border-color: var(--accent); }
  /* One accent per axis, so the pairs read as pairs. */
  .padbtn.ax0 .glyph { color: #ff9e6d; }
  .padbtn.ax1 .glyph { color: #6ee7a8; }
  .padbtn.ax2 .glyph { color: #7cc4ff; }
  .padbtn.ax3 .glyph { color: #c89bff; }
  .padbtn.dead { opacity: .3; cursor: default; }
  .padbtn.dead:hover { border-color: var(--line); }
  .padbtn.hit { animation: hit .22s ease-out; }
  .padbtn.miss { animation: miss .22s ease-out; }
  @keyframes hit  { from { background: #2f6b4e; } to { background: #1e2634; } }
  @keyframes miss { from { background: #6b2f3d; } to { background: #1e2634; } }
  .padfoot { margin-top: 10px; display: flex; flex-direction: column; gap: 3px;
             color: var(--dim); font-size: 11px; }
  kbd { background: #232c3b; border: 1px solid var(--line); border-radius: 4px;
        padding: 0 4px; font: inherit; font-size: 10.5px; }
  /* The 4th-dimension pair is meaningless on a 3D level. */
  body:not(.four-d) .padbtn.ax3 { display: none; }
  #help p { margin: 0 0 6px; }
  #help p:last-child { margin-bottom: 0; }
  .controls { margin-top: 10px; display: flex; gap: 8px; }
  select, button {
    font: inherit; font-size: 13px; color: var(--ink); background: #1e2634;
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; cursor: pointer;
  }
  select { flex: 1; }
  button:hover, select:hover { border-color: var(--accent); }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="panel" id="hud">
  <h1 id="level">—</h1>
  <p id="blurb"></p>
  <div class="row"><span>Length</span><span id="len">0</span></div>
  <div class="row"><span>Taut at</span><span id="target">0</span></div>
  <div class="row" id="detRow"><span>Knot determinant</span><span id="det">1</span></div>
  <div id="status"></div>
  <div class="controls">
    <select id="levels"></select>
    <button id="reset">Reset</button>
  </div>
</div>

<div class="panel" id="padPanel">
  <div class="padhead">Push the rope</div>
  <div id="selInfo">nothing selected</div>
  <div id="pad"></div>
  <div class="padfoot">
    <span><kbd>space</kbd> reverse</span>
    <span><kbd>shift</kbd>+dir rotates 4D</span>
  </div>
</div>

<div class="panel" id="help">
  <p><b>Click a cell</b> to select it.</p>
  <p><b>Push a direction</b> and the rope goes that way; the selection follows,
     so you can sculpt along the strand.</p>
  <p><b>Drag the background</b> to look around.</p>
  <p class="goal">Pull the rope taut.</p>
</div>

<script type="module" src="./src/app.js"></script>
</body>
</html>
