<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unknot</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161c26; --line: #2c3646;
    --ink: #e8eef7; --dim: #8fa0b8; --accent: #4cc9f0; --good: #6ee7a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--ink); }
  /* dvh follows the visible area as a mobile browser's chrome slides in and
     out; vh does not, and leaves the bottom of the board under the URL bar. */
  #view { display: block; width: 100vw; height: 100vh; height: 100dvh;
          touch-action: none; cursor: grab; }
  #view:active { cursor: grabbing; }
  .panel {
    position: fixed;
    /* A drag that starts on a panel should not smear a text selection across
       the UI. */
    user-select: none; background: color-mix(in srgb, var(--panel) 88%, transparent);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    backdrop-filter: blur(8px);
  }
  #hud { top: 14px; left: 14px; width: 232px; }
  #hud h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: .02em; }
  #blurb { margin: 0 0 10px; color: var(--dim); font-size: 12.5px; }
  #status { margin-top: 8px; font-weight: 600; letter-spacing: .08em; font-size: 12px; }
  #status.solved { color: var(--good); }

  /* Direction pad */
  /* A small rocking view of the whole puzzle, for decoding busy tangles. */
  /* Opaque, so the minimap's halo colour matches exactly and crossings read
     as clean breaks rather than dark smudges. */
  /* Clear of the HUD on the left and the pad on the right. */
  #mapPanel { bottom: 14px; right: 14px; padding: 8px; width: 256px;
              background: #161c26; }
  #minimap { display: block; width: 240px; height: 160px; }
  .padhead { font-weight: 600; margin: 12px 0 8px; }
  #pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .padbtn {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 7px 0 5px; border-radius: 7px; cursor: pointer;
    background: #1e2634; border: 1px solid var(--line); color: var(--ink);
    font: inherit; transition: border-color .12s, background .12s, opacity .12s;
  }
  .padbtn .glyph { font-size: 15px; line-height: 1; }
  .padbtn .nm { font-size: 9.5px; color: var(--dim); letter-spacing: .02em; }
  .padbtn:hover { border-color: var(--accent); }
  /* One accent per axis, so the pairs read as pairs. */
  .padbtn.ax0 .glyph { color: #ff9e6d; }
  .padbtn.ax1 .glyph { color: #6ee7a8; }
  .padbtn.ax2 .glyph { color: #7cc4ff; }
  .padbtn.ax3 .glyph { color: #c89bff; }
  .padbtn.dead { opacity: .3; cursor: default; }
  .padbtn.dead:hover { border-color: var(--line); }
  .padbtn.hit { animation: hit .22s ease-out; }
  .padbtn.miss { animation: miss .22s ease-out; }
  @keyframes hit  { from { background: #2f6b4e; } to { background: #1e2634; } }
  @keyframes miss { from { background: #6b2f3d; } to { background: #1e2634; } }
  .padfoot { margin-top: 8px; display: flex; flex-direction: column; gap: 3px;
             color: var(--dim); font-size: 11px; }
  kbd { background: #232c3b; border: 1px solid var(--line); border-radius: 4px;
        padding: 0 4px; font: inherit; font-size: 10.5px; }
  /* The 4th-dimension pair is meaningless on a 3D level. */

  /* ---------------------------------------------------------------------
     Narrow screens.

     One panel now, and the pad is the part a thumb has to reach, so the whole
     thing sits along the bottom. The title and status ride on one line above
     the buttons, and the minimap takes the free space at the top right.
     --------------------------------------------------------------------- */
  @media (max-width: 620px) {
    .panel { padding: 9px 11px; border-radius: 9px; }

    #hud { top: auto; bottom: 8px; left: 8px; right: 8px; width: auto; }
    #hud h1 { font-size: 13.5px; display: inline; }
    #blurb { display: none; }
    #status { display: inline; margin-left: 12px; }
    /* The heading row doubles as the pad's label, so the label itself goes. */
    .padhead { display: none; }
    #pad { gap: 8px; margin-top: 8px; }
    .padbtn { padding: 10px 0 8px; }
    .padbtn .glyph { font-size: 17px; }
    .padfoot { display: none; }
    #hud .controls { margin-top: 8px; }

    /* The map takes the space the panel no longer occupies, up at the top. */
    #mapPanel { top: 8px; right: 8px; bottom: auto; width: 132px; padding: 6px; }
    #minimap { width: 120px; height: 80px; }
  }

  /* Any short window -- a phone in landscape included -- has no room for the
     map between the status bar and the controls, so drop it and keep the
     controls. Keyed on height alone, since a landscape phone is wide. */
  @media (max-height: 460px) {
    #mapPanel { display: none; }
  }
  .controls { margin-top: 10px; display: flex; gap: 8px; }
  select, button {
    font: inherit; font-size: 13px; color: var(--ink); background: #1e2634;
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; cursor: pointer;
  }
  select { flex: 1; }
  button:hover, select:hover { border-color: var(--accent); }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="panel" id="hud">
  <h1 id="level">—</h1>
  <p id="blurb"></p>
  <div id="status"></div>
  <div class="padhead">Push the rope</div>
  <div id="pad"></div>
  <div class="padfoot">
    <span><kbd>shift</kbd>+dir rotates 4D</span>
  </div>
  <div class="controls">
    <select id="levels"></select>
    <button id="reset">Reset</button>
  </div>
</div>

<div class="panel" id="mapPanel">
  <svg id="minimap" viewBox="0 0 240 160" preserveAspectRatio="xMidYMid meet"></svg>
</div>

<script type="module" src="./src/app.js"></script>
</body>
</html>
