<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4D Snake</title>
<link rel="stylesheet" href="../../shared/style.css">
<style>
  /* Snake's own furniture: a score readout. Everything else -- the pad, the
     panel, the game-over card, the axis colours -- comes from the shared
     sheet, so this game and Unknot look like two views of one thing. */
  #stats { display: flex; gap: 18px; margin: 8px 0 2px; }
  #stats div { display: flex; flex-direction: column; }
  #stats .v { font-size: 19px; font-weight: 700; line-height: 1.15; }
  #stats .k { font-size: 9.5px; color: var(--dim); letter-spacing: .1em;
              text-transform: uppercase; }
  #score { color: var(--accent); }
  /* The slice readout is purple, matching the w pair on the pad and the ring
     of frames on screen -- one colour for the fourth dimension throughout. */
  #slice { color: var(--ax3); }

  /* The slice panel says what it is and which axes it is holding still --
     without that it is a grid of coloured squares. */
  .maphead { font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
             color: var(--dim); margin-bottom: 5px; }
  .mapfoot { font-size: 10px; color: var(--dim); margin-top: 4px;
             text-align: center; }
  .mapfoot b { color: var(--ink); font-weight: 600; }
  /* The shared sheet sizes the map panel for unknot's wide knot diagram. A
     slice of a cube is square, so this one is too -- and a little larger,
     since every cell in it is a place the snake can be and wants to be
     clickable-sized to the eye. */
  #mapPanel { width: 214px; }
  #minimap { width: 196px; height: 196px; }

  /* The restart button names the key first and what it does underneath, so the
     answer to "how do I play again" is the thing you read, not something you
     have to go looking for in the help text. It stays clickable for anyone who
     reaches for the mouse. */
  #restart { display: inline-flex; flex-direction: column; align-items: center;
             gap: 2px; padding: 8px 22px; }
  #restart .key { font-size: 15px; font-weight: 700; letter-spacing: .04em; }
  #restart .sub { font-size: 10px; color: var(--dim); letter-spacing: .1em;
                  text-transform: uppercase; }
  #restart:hover .sub { color: var(--ink); }

  @media (max-width: 620px) {
    #stats { margin: 0; gap: 14px; display: inline-flex; vertical-align: middle; }
    #stats .v { font-size: 15px; }
    /* On a phone the panel keeps the map and drops the prose around it. */
    .maphead, .mapfoot { display: none; }
    #mapPanel { width: 116px; }
    #minimap { width: 104px; height: 104px; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="panel" id="hud">
  <h1>4D Snake</h1>
  <p id="blurb">Six cubes, six deep. The fourth direction wraps around.</p>

  <div id="stats">
    <div><span class="v" id="score">0</span><span class="k">Score</span></div>
    <div><span class="v" id="length">4</span><span class="k">Length</span></div>
    <div><span class="v" id="slice">0 / 6</span><span class="k">Slice</span></div>
  </div>

  <div class="padhead">Move the head</div>
  <div id="pad"></div>
  <div class="padfoot">
    <span><kbd>A</kbd>/<kbd>D</kbd> wrap around the ring</span>
    <span><kbd>R</kbd> restarts &middot; drag to look</span>
  </div>
</div>

<div class="panel" id="mapPanel">
  <div class="maphead">Slice at the head</div>
  <svg id="minimap" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="mapfoot">x <b id="mapX">0</b> &middot; z <b id="mapZ">0</b> held fixed</div>
</div>

<div id="over">
  <div class="card">
    <h2>Game over</h2>
    <p class="cause" id="overCause"></p>
    <div class="score" id="overScore">0</div>
    <div class="scorelbl">Final score</div>
    <button id="restart"><span class="key">Space</span><span class="sub">Play Again</span></button>
  </div>
</div>

<script type="module" src="./src/app.js"></script>
</body>
</html>
